<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="dm-roleplaying 구성도: 메신저 DM은 ingest로 들어와 SQLite 원장에 쌓이고, gate가 모델 호출 없이 지금 판단이 필요한지 정합니다. 모델은 현재 상태를 받아 결정 JSON을 돌려주고, apply가 이를 검증한 뒤 원장에 한 번에 반영합니다. dispatch가 발송 잠금과 결과 확인을 거쳐 메신저로 답장을 보냅니다.">
<rect width="640" height="380" fill="#fff"></rect>
